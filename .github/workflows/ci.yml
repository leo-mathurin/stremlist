name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
  # Every base branch, so stacked feature PRs get the same checks.
  pull_request:

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchanged for a short-lived Vercel Remote Cache token (no stored secret).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fork PRs get no OIDC token, so they fall back to a cold local cache.
      # Best-effort: a failed token exchange must not block CI or the release.
      - name: Set up Turborepo Remote Cache
        if: vars.TURBO_TEAM != '' && github.event.pull_request.head.repo.fork != true
        continue-on-error: true
        # Pinned to a commit: this step runs with id-token: write.
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun ci

      - name: Lint, build, and test
        run: bunx turbo run lint build test

      - name: Smoke-test backend bundle
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_ROLE_KEY: test
          RESEND_API_KEY: re_test
          RESEND_AUDIENCE_ID: test
        # Production runs this bundle on Vercel's Bun runtime (apps/backend/vercel.json),
        # so load it with Bun and serve one request that needs no external service.
        run: |
          bun --eval '
            const { default: app } = await import("./apps/backend/dist/index.js");
            const res = await app.fetch(new Request("http://localhost/manifest.json"));
            const body = await res.json();
            if (res.status !== 200 || body.id !== "com.stremlist") {
              throw new Error(`Unexpected manifest response: ${res.status} ${JSON.stringify(body)}`);
            }
          '

  e2e:
    name: E2E
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Start local Supabase (db + REST only)
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Test atomic configuration replacement
        run: docker exec -i supabase_db_stremlist psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/replace_account_config.sql

      - name: Test List sync status recording
        run: docker exec -i supabase_db_stremlist psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/record_list_refresh.sql

      - name: Start local R2-compatible store
        run: |
          docker run --rm -d --name stremlist-e2e-r2 \
            -p 127.0.0.1:7431:9000 \
            -e RUSTFS_ACCESS_KEY=stremlist-e2e \
            -e RUSTFS_SECRET_KEY=stremlist-e2e-secret \
            rustfs/rustfs:1.0.1 /data

      - name: Install dependencies
        run: bun ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium

      - name: Install toolkit Chromium
        run: bun run --cwd apps/e2e e2e-web install chromium --with-deps

      - name: Run tester-army toolkit
        run: bun run test:toolkit:replay

      - name: Run E2E tests
        run: bun run --filter @stremlist/e2e test:e2e

      - name: Upload toolkit report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-report
          include-hidden-files: true
          path: apps/e2e/.e2e
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  version-bump:
    name: Auto version bump
    needs: ci
    # Only on a real push to main (i.e. after a PR merge), never on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize so rapid merges don't race on pushing to main.
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Repo-admin PAT: the default GITHUB_TOKEN can't be granted ruleset
          # bypass on a personal repo, so we push the bump as an admin (who can).
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compute version bump from Conventional Commits
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: node .github/scripts/compute-bump.mjs

      - name: Apply version bump
        if: steps.bump.outputs.bump != 'none'
        run: node .github/scripts/set-version.mjs "${{ steps.bump.outputs.new_version }}"

      - name: Commit and push
        if: steps.bump.outputs.bump != 'none'
        env:
          NEW: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/shared/src/constants.ts
          git commit -m "chore(release): v${NEW} [skip ci]"
          git push origin HEAD:main
