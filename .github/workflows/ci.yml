name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build, and test
        run: pnpm turbo run lint build test

      - name: Smoke-test backend bundle
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_ROLE_KEY: test
          RESEND_API_KEY: re_test
          RESEND_AUDIENCE_ID: test
        run: node --input-type=module --eval 'await import("./apps/backend/dist/index.js")'

  e2e:
    name: E2E
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Start local Supabase (db + REST only)
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Start local R2-compatible store
        run: |
          docker run --rm -d --name stremlist-e2e-r2 \
            -p 127.0.0.1:7431:9000 \
            -e MINIO_ROOT_USER=stremlist-e2e \
            -e MINIO_ROOT_PASSWORD=stremlist-e2e-secret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @stremlist/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @stremlist/e2e test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  version-bump:
    name: Auto version bump
    needs: ci
    # Only on a real push to main (i.e. after a PR merge), never on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize so rapid merges don't race on pushing to main.
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Repo-admin PAT: the default GITHUB_TOKEN can't be granted ruleset
          # bypass on a personal repo, so we push the bump as an admin (who can).
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute version bump from Conventional Commits
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: node .github/scripts/compute-bump.mjs

      - name: Apply version bump
        if: steps.bump.outputs.bump != 'none'
        run: node .github/scripts/set-version.mjs "${{ steps.bump.outputs.new_version }}"

      - name: Commit and push
        if: steps.bump.outputs.bump != 'none'
        env:
          NEW: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/shared/src/constants.ts
          git commit -m "chore(release): v${NEW} [skip ci]"
          git push origin HEAD:main
